<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AKL Gaming HUB</title>
<link rel="stylesheet" href="style.css">
<style>
    /* Tab Switcher Style (Games / Apps) */
    .type-tabs {
        display: flex;
        gap: 10px;
        padding: 0 16px;
        margin-bottom: 15px;
    }
    .type-tab-btn {
        flex: 1;
        padding: 10px;
        border: none;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        background: var(--card-bg, #f0f0f0);
        color: var(--text-color, #333);
        transition: all 0.2s ease;
    }
    .type-tab-btn.active {
        background: #ff3b30;
        color: #fff;
    }

    /* List Layout (45 items per page) */
    .games-grid { 
        display: flex !important;
        flex-direction: column !important;
        gap: 10px !important; 
        padding: 0 16px;
    }
    .game-card { 
        display: flex !important;
        align-items: center !important;
        gap: 12px !important;
        padding: 10px 12px !important; 
        border-radius: 12px !important; 
        overflow: hidden; 
        cursor: pointer; 
        background: var(--card-bg, #1e1e1e);
        box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .game-card-image, .game-card img { 
        width: 60px !important; 
        height: 60px !important; 
        min-width: 60px !important; 
        min-height: 60px !important; 
        object-fit: cover !important; 
        border-radius: 10px !important; 
        display: block; 
        margin: 0 !important; 
    }
    .game-info-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        overflow: hidden;
        flex: 1;
    }
    .game-card-name { 
        width: 100%; 
        font-size: 14px !important; 
        font-weight: 600;
        line-height: 18px !important; 
        text-align: left !important; 
        overflow: hidden; 
        text-overflow: ellipsis; 
        white-space: nowrap; 
        color: var(--text-color, #fff);
    }
    .game-card-version {
        font-size: 12px;
        color: var(--text-muted, #aaa);
        margin-top: 4px;
    }

    /* Featured Scroll & Cards Layout (Fixed) */
    .featured-scroll {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        padding: 0 16px 10px 16px;
        scroll-snap-type: x mandatory;
    }
    .featured-scroll::-webkit-scrollbar {
        display: none;
    }
    .featured-card {
        min-width: 130px;
        max-width: 130px;
        background: var(--card-bg, #1e1e1e);
        border-radius: 12px;
        padding: 10px;
        flex-shrink: 0;
        cursor: pointer;
        box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        text-align: center;
    }
    .featured-card .game-card-image {
        width: 75px !important;
        height: 75px !important;
        min-width: 75px !important;
        min-height: 75px !important;
        border-radius: 12px !important;
        margin-bottom: 8px !important;
        object-fit: cover !important;
    }
    .featured-card .game-card-name {
        font-size: 13px !important;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        width: 100%;
        text-align: center !important;
        color: var(--text-color, #fff);
    }

    /* Pagination Styles */
    .pagination-container {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 6px;
        margin: 25px 0;
        padding: 0 16px;
        flex-wrap: wrap;
    }
    .page-btn {
        min-width: 36px;
        height: 36px;
        padding: 0 8px;
        border: none;
        border-radius: 8px;
        background: var(--card-bg, #2a2a2a);
        color: var(--text-color, #fff);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
    }
    .page-btn.active {
        background: #ff3b30;
        color: #fff;
    }
    .page-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }

    .tg-header-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: #0088cc;
        color: #fff;
        padding: 5px 10px;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 700;
        text-decoration: none;
        margin-right: 8px;
    }
</style>
</head>
<body>
<div id="splashScreen">
    <div class="splash-content">
        <div class="splash-icon"><img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjdlp1fH2LNUM_d5_6HInbfrVXdgNKSgB_93NNHAhGdxyruSsyo6qp-Ly9-c6jV6OaKJEFStGsZZSnstu14zPl-qz5QdTAJNLzxieVPDocLnfbnnrIih1rQNU0XX3cuxXhC1YlSPBk4RLuNLePJaTP3kE2AFnXcE4nwYhPdP8aIwCMPGDmgFcBnR8kGmhU/s1280/44697.png" alt="Logo"></div>
        <h1 class="splash-title">AKL Gaming HUB</h1>
        <div class="splash-loader"></div>
    </div>
</div>

<div id="mainApp" style="display:none;">
    <header class="app-header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">
                    <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhjOc0nKLw9Dc7vnEr9MiYcpWJEsdxc30AZG07u_xkNzREy_G8796CK-cMwHh5julpufaRncCnlcgor4kan41hz1AMI6APrPO9irLlETgRcab-Dqz3jVYvVt9GWxKgr9_aoMyZhxCWfRUf7JyCNg24GWF6vnRWArt8S70f4ircALsXcWACU6nteQvSKZ8Q/s1283/44700.png" alt="AKL Gaming HUB Logo">
                </div>
                <span class="logo-text">AKL Gaming HUB</span>
            </div>
            
            <div style="display: flex; align-items: center;">
                <!-- Telegram Join Button -->
                <a href="https://t.me/aklgamesharing" target="_blank" class="tg-header-btn">📢 Join TG</a>
                <!-- Dark / Light Mode Toggle Button -->
                <button type="button" id="themeToggleBtn" onclick="toggleTheme()" style="background:none; border:none; cursor:pointer; font-size:20px; padding:5px;">🌙</button>
            </div>
        </div>
    </header>

    <div class="search-container">
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Search games & apps..." class="search-input">
        </div>
    </div>

    <!-- Type Switcher Tabs (Games / Apps) -->
    <div class="type-tabs">
        <button type="button" class="type-tab-btn active" id="tabGameBtn" onclick="switchContentType('game')">🕹️ Games</button>
        <button type="button" class="type-tab-btn" id="tabAppBtn" onclick="switchContentType('app')">📱 Apps</button>
    </div>

    <main class="main-content">
        <section class="featured-section" id="featuredSectionWrapper">
            <h2 class="section-title">⭐ Featured</h2>
            <div class="featured-scroll" id="featuredGames"></div>
        </section>

        <section class="categories-section" id="categories">
            <h2 class="section-title">📂 Categories</h2>
            <div class="categories-scroll" id="categoriesList"></div>
        </section>

        <section class="games-section">
            <h2 class="section-title" id="listSectionTitle">🕹️ Latest Games</h2>
            <div class="games-grid" id="gamesList"></div>
            <!-- Pagination Controls -->
            <div class="pagination-container" id="paginationContainer"></div>
        </section>
    </main>

    <nav class="bottom-nav">
        <button type="button" class="nav-item active" data-page="home" onclick="goHomePage()">🏠 Home</button>
        <button type="button" class="nav-item" data-page="categories" onclick="goCategoriesPage()">📂 Categories</button>
    </nav>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
