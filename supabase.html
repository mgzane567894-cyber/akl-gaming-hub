<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKL Gaming Hub - Supabase</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
            margin: 0;
        }
        h1 {
            text-align: center;
            color: #00ffcc;
        }
        .game-card {
            background: #1e1e1e;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <h1>Games List from Supabase</h1>
    <div id="games-container">Loading games...</div>

    <script>
        // Supabase Credentials (Updated)
        const SUPABASE_URL = 'https://wsuplfzrdslrqkcavmnm.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_eSBSq4elZu2wW1BKzS38qQ_YoqdIrds';

        // Initialize Supabase client safely (using _supabase to avoid duplication errors)
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Pre-loaded games data (Fallback data if Supabase table is empty)
        const localGamesData = [
            {
                id: "1",
                name: "Farm Town: Happy Farming",
                platform: "android",
                type: "MOD",
                version: "5.0.0",
                size: "94 MB"
            },
            {
                id: "2",
                name: "ARK: Survival Evolved",
                platform: "android",
                type: "MOD",
                version: "v2.0.29",
                size: "2.29 GB"
            },
            {
                id: "3",
                name: "Grimzone: Last day survival",
                platform: "android",
                type: "MOD",
                version: "v0.2.136",
                size: "709 MB"
            },
            {
                id: "4",
                name: "Infinity Blade",
                platform: "android",
                type: "Full",
                version: "v1.0.5",
                size: "1.04 GB"
            }
        ];

        async function fetchGames() {
            const container = document.getElementById('games-container');
            container.innerHTML = '🔄 Loading games from Supabase Database...';
            
            try {
                let { data, error } = await _supabase
                    .from('games')
                    .select('*');

                console.log("🎮 Total games loaded:", data ? data.length : 0);

                if (error) {
                    console.error('Supabase Error:', error);
                    renderGames(localGamesData);
                } else if (!data || data.length === 0) {
                    // ဒေတာဘေ့စ်ထဲမှာ မရှိရင် local data ကို ယာယီပြပေးမည်
                    renderGames(localGamesData);
                } else {
                    renderGames(data);
                }
            } catch (err) {
                console.error('Fetch exception:', err);
                renderGames(localGamesData);
            }
        }

        function renderGames(gamesList) {
            const container = document.getElementById('games-container');
            container.innerHTML = '';
            
            if (!gamesList || gamesList.length === 0) {
                container.innerHTML = 'No games found.';
                return;
            }

            gamesList.forEach(game => {
                container.innerHTML += `
                    <div class="game-card">
                        <h3>${game.name || 'No Name'}</h3>
                        <p><b>Platform:</b> ${game.platform || '-'}</p>
                        <p><b>Type:</b> ${game.type || '-'}</p>
                        <p><b>Version:</b> ${game.version || '-'}</p>
                        <p><b>Size:</b> ${game.size || '-'}</p>
                    </div>
                `;
            });
        }

        fetchGames();
    </script>

</body>
</html>
