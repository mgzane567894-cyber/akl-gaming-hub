<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloading - AKL Gaming HUB</title>
    <style>
        body { background-color: #121212; color: #fff; font-family: Arial, sans-serif; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 500px; margin: 60px auto; background: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { margin-bottom: 10px; color: #ffcc00; }
        p { color: #aaa; font-size: 14px; margin-bottom: 25px; }
        .ad-box { background: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 13px; color: #ffd700; border: 1px dashed #555; }
        
        .timer-container { position: relative; width: 90px; height: 90px; margin: 20px auto; display: flex; align-items: center; justify-content: center; background: #252525; border-radius: 50%; border: 3px solid #28a745; font-size: 32px; font-weight: bold; color: #28a745; }
        
        .btn { display: inline-block; background: #28a745; color: white; padding: 14px 25px; font-size: 16px; font-weight: bold; text-decoration: none; border-radius: 8px; transition: 0.2s; cursor: pointer; margin-top: 15px; }
        .btn:hover { background: #218838; }
        .back-btn { display: block; margin-top: 20px; color: #aaa; text-decoration: none; font-size: 14px; }
        .back-btn:hover { color: #fff; }
    </style>
</head>
<body>

    <div class="container">
        <h2 id="gameTitle">Preparing Download...</h2>
        <p id="statusText">Your download will start in a few seconds</p>

        <div class="ad-box">
            📢 An ad will appear before downloading. Close it, then click download again. Ads help keep our site running.
        </div>

        <div id="timerBox" class="timer-container">5</div>

        <!-- အကယ်၍ အလိုအလျောက် မဆင်းရင် လက်နဲ့နှိပ်ဖို့ ခလုတ် -->
        <a id="downloadBtn" href="#" class="btn" style="display:none;">📥 Download APK Now</a>
        <br>
        <a href="javascript:history.back()" class="back-btn">← Back</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const rawUrl = urlParams.get('url');
        const gameName = urlParams.get('name') || "Game";

        if (rawUrl) {
            document.getElementById('gameTitle').textContent = `Download ${gameName}`;
            
            let timeLeft = 5; // ၅ စက္ကန့် စရေမည်
            const timerBox = document.getElementById('timerBox');
            const statusText = document.getElementById('statusText');
            const downloadBtn = document.getElementById('downloadBtn');

            const countdown = setInterval(() => {
                timeLeft--;
                timerBox.textContent = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    timerBox.style.display = 'none'; // စက္ကန့်ဝိုင်း ပျောက်မည်
                    statusText.textContent = "Your download is starting...";

                    let extension = ".apk";
                    if (rawUrl.toLowerCase().includes(".obb")) extension = ".obb";
                    
                    let safeName = gameName.replace(/[^a-zA-Z0-9 _-]/g, "").trim().replace(/\s+/g, "-");
                    let finalFileName = `${safeName}-mod${extension}`;

                    // ခလုတ်အတွက် လင့်ခ်နှင့် နာမည်အမှန် သတ်မှတ်ခြင်း
                    downloadBtn.href = rawUrl;
                    downloadBtn.setAttribute('download', finalFileName);
                    downloadBtn.style.display = 'inline-block';

                    // အလိုအလျောက် <a> tag ကို click လုပ်ပြီး လမ်းကြောင်းပြောင်းစေရန်
                    let a = document.createElement('a');
                    a.href = rawUrl;
                    a.setAttribute('download', finalFileName);
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);

                    // Browser အပေါ်မူတည်၍ လမ်းကြောင်းတိုက်ရိုက်ပြောင်းရန် (Backup)
                    setTimeout(() => {
                        window.location.href = rawUrl;
                    }, 400);
                }
            }, 1000);

        } else {
            document.getElementById('gameTitle').textContent = "❌ Invalid Download Link!";
            document.getElementById('timerBox').style.display = 'none';
        }
    </script>

</body>
</html>
