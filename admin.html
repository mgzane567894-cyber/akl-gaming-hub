<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - AKL Gaming HUB</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- 🔒 Admin Login Modal -->
<div id="adminLoginModal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #121212; display: flex; justify-content: center; align-items: center; z-index: 9999;">
    <div style="background: #1e1e2f; padding: 30px; border-radius: 12px; width: 90%; max-width: 350px; text-align: center; border: 1px solid #333;">
        <h2 style="color: #fff; margin-bottom: 20px; font-size: 20px;">🔐 Admin Login</h2>
        <input type="password" id="adminPasswordInput" placeholder="Password ထည့်ပါ..." style="width: 100%; padding: 12px; background: #2a2a3d; border: 1px solid #444; color: #fff; border-radius: 6px; margin-bottom: 15px; font-size: 14px; outline: none; box-sizing: border-box;">
        <button type="button" onclick="verifyAdminPassword()" style="width: 100%; padding: 12px; background: #00bcd4; color: #000; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; font-size: 14px;">ဝင်မည်</button>
        <p id="loginErrorMsg" style="color: #ff5252; font-size: 12px; margin-top: 10px; display: none;">❌ Password မှားယွင်းနေပါသည်။</p>
    </div>
</div>

<!-- 🛠️ Admin Dashboard -->
<div id="adminApp" style="display: none;">
    <header class="admin-header">
        <div class="admin-header-content">
            <a href="index.html" class="back-btn">← Back</a>
            <span class="admin-title">⚙️ Admin Panel (Firebase)</span>
            <button type="button" onclick="adminLogout()" style="background: #ff5252; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; font-size: 12px; cursor: pointer;">Logout</button>
        </div>
    </header>

    <div id="dashboardScreen" class="dashboard-screen">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalGames">0</div>
                <div class="stat-label">Total Items</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="featuredGames">0</div>
                <div class="stat-label">Featured</div>
            </div>
        </div>

        <div class="admin-actions">
            <button class="action-btn primary" onclick="showAddForm()" style="width: 100%;">➕ Add New Item (Game / App)</button>
        </div>

        <!-- 📦 JSON Bulk Import Box -->
        <div style="background: #1e1e2f; padding: 15px; border-radius: 12px; margin: 15px 0; border: 1px dashed #00bcd4;">
            <h3 style="margin-bottom: 10px; font-size: 15px; color: #fff;">📦 Bulk Import Games/Apps (JSON)</h3>
            <input type="file" id="jsonBatchFile" accept=".json" style="color: #fff; margin-bottom: 10px; width: 100%; font-size: 13px;">
            <button type="button" class="action-btn primary" style="width: 100%; padding: 10px; background: #00bcd4; color: #000; font-weight: bold; border-radius: 6px; border: none; cursor: pointer;" onclick="uploadJSONBatch()">🚀 ဖိုင်မှ ဒေတာများ တင်သွင်းမည်</button>
        </div>

        <div id="gameForm" class="game-form" style="display:none;">
            <h3 class="form-title" id="formTitle">➕ Add New Item</h3>
            <form id="gameFormInputs" onsubmit="saveGame(event)">
                <input type="hidden" id="editId">
                
                <div class="form-group">
                    <label>Name (Game / App Name) *</label>
                    <input type="text" id="gameName" placeholder="Enter name" required>
                </div>

                <div class="form-group">
                    <label>Platform / Category Type *</label>
                    <select id="gamePlatform" required>
                        <option value="">Select Platform / Type</option>
                        <option value="android">Android (Game)</option>
                        <option value="psp">PSP</option>
                        <option value="ps2">PS2</option>
                        <option value="wii">Wii</option>
                        <option value="app">App / Utility / Tool</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Type *</label>
                    <select id="gameType" required>
                        <option value="Original">Original</option>
                        <option value="MOD">MOD</option>
                        <option value="Full">Full</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Version</label>
                        <input type="text" id="gameVersion" placeholder="1.0.0">
                    </div>
                    <div class="form-group">
                        <label>Size</label>
                        <input type="text" id="gameSize" placeholder="45 MB">
                    </div>
                </div>

                <div class="form-group">
                    <label>Cover / Icon URL</label>
                    <input type="url" id="gameIcon" placeholder="https://example.com/cover.jpg">
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea id="gameDescription" placeholder="Description..." rows="4"></textarea>
                </div>

                <div class="form-group">
                    <label>Features</label>
                    <input type="text" id="gameFeatures" placeholder="Open World, Offline, Tools">
                    <small>Separate each feature with a comma.</small>
                </div>

                <!-- 📶 Data Download Link -->
                <div class="form-group" style="background: rgba(245, 158, 11, 0.1); padding: 12px; border-radius: 8px; border: 1px solid rgba(245, 158, 11, 0.3);">
                    <label style="color: #f59e0b; font-weight: bold;">📶 Data Download URL *</label>
                    <input type="url" id="gameDataDownloadUrl" placeholder="https://example.com/data-version" required style="margin-top: 5px;">
                </div>

                <!-- 🛜 WiFi Download Link -->
                <div class="form-group" style="background: rgba(16, 185, 129, 0.1); padding: 12px; border-radius: 8px; border: 1px solid rgba(16, 185, 129, 0.3);">
                    <label style="color: #10b981; font-weight: bold;">🛜 WiFi Download URL (Optional)</label>
                    <input type="url" id="gameWifiDownloadUrl" placeholder="https://example.com/wifi-version" style="margin-top: 5px;">
                </div>

                <div class="form-group">
                    <label>📦 OBB File URL (Optional)</label>
                    <input type="url" id="gameObbUrl" placeholder="https://example.com/obb-file.zip">
                </div>

                <div class="form-group playstore-admin-group">
                    <label>▶️ Google Play Store URL</label>
                    <input type="url" id="gamePlayStoreUrl" placeholder="https://play.google.com/store/apps/details?id=...">
                </div>

                <div class="screenshots-admin-box">
                    <div class="screenshots-admin-title">📸 Screenshots</div>
                    <div class="form-group">
                        <label>Screenshot 1</label>
                        <input type="url" id="screenshot1" placeholder="URL 1">
                    </div>
                    <div class="form-group">
                        <label>Screenshot 2</label>
                        <input type="url" id="screenshot2" placeholder="URL 2">
                    </div>
                    <div class="form-group">
                        <label>Screenshot 3</label>
                        <input type="url" id="screenshot3" placeholder="URL 3">
                    </div>
                    <div class="form-group">
                        <label>Screenshot 4</label>
                        <input type="url" id="screenshot4" placeholder="URL 4">
                    </div>
                </div>

                <div class="form-group checkbox-group" style="margin-top: 10px;">
                    <label style="color: #00bcd4; font-weight: bold;">
                        <input type="checkbox" id="gameIsSmall"> 🕹️ Small Game (ဂိမ်းအသေးစားများအတွက်)
                    </label>
                </div>

                <div class="form-group checkbox-group">
                    <label>
                        <input type="checkbox" id="gameFeatured"> Featured Item
                    </label>
                </div>

                <div class="form-actions">
                    <button type="submit" class="action-btn primary">💾 Save Item</button>
                    <button type="button" class="action-btn secondary" onclick="cancelForm()">Cancel</button>
                </div>
            </form>
        </div>

        <div class="games-list-section">
            <h3 class="section-title">📋 Manage Games & Apps</h3>
            <div class="search-container" style="margin-bottom: 15px;">
                <input type="text" id="gameSearchInput" placeholder="🔍 နာမည် ရိုက်ရှာရန်..." style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; font-size: 15px; box-sizing: border-box;">
            </div>
            <div id="adminGamesList" class="admin-games-list"></div>
        </div>
    </div>
</div>

<script type="module" src="admin.js"></script>
</body>
</html>
